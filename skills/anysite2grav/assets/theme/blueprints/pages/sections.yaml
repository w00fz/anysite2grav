title: Sections page
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      fields:
        content:
          import@:
            type: partials/page-fields
            context: blueprints://pages
        sections_tab:
          type: tab
          title: Sections
          fields:
            header.sections:
              type: list
              label: Sections
              style: vertical
              collapsed: true
              help: Rendered top to bottom. "Shared" reuses a section page from /shared.
              fields:
                .type:
                  type: select
                  label: Type
                  default: section
                  options:
                    section: Section
                    shared: Shared section
                .shared:
                  type: text
                  label: Shared section name
                  help: Folder name under /shared (only for Shared sections)
                .id:
                  type: text
                  label: Anchor id
                .tone:
                  type: select
                  label: Tone
                  help: Background and text colors from the theme palette (tokens.css)
                  options: {'': Page default, light: Light, muted: Muted, dark: Dark, accent: Accent}
                .space:
                  type: select
                  label: Spacing
                  help: Vertical padding step from the theme scale (tokens.css → --space-*)
                  options: {'': Theme default, none: None, s: Small, m: Medium, l: Large, xl: Extra large}
                .layout:
                  type: select
                  label: Layout
                  options: {'': Stacked, split: Split (heading beside content)}
                .ratio:
                  type: array
                  label: Split ratio
                  value_only: true
                  help: Column widths as fr units, e.g. 1 and 2.75
                .split_divider:
                  type: toggle
                  label: Rule between split columns
                  highlight: 1
                  default: 0
                  options: {1: Yes, 0: No}
                  validate: {type: bool}
                .divider:
                  type: select
                  label: Divider line
                  options: {'': None, top: Top, bottom: Bottom, both: Top and bottom}
                .align:
                  type: select
                  label: Text alignment
                  options: {'': Start, center: Center}
                .classes:
                  type: array
                  label: Style hooks
                  value_only: true
                  help: Rendered as src-<class> CSS hooks
                .modal:
                  type: toggle
                  label: Show as modal dialog
                  highlight: 1
                  default: 0
                  options: {1: Yes, 0: No}
                  validate: {type: bool}
                .background:
                  type: media
                  label: Background image
                  sources: [page, site, url]
                  accept: ['image/*']
                .background_video.sources:
                  type: array
                  label: Background video files
                  value_only: true
                  help: Autoplaying muted video behind the section content
                .blocks:
                  type: list
                  label: Blocks
                  style: vertical
                  collapsed: true
                  import@:
                    type: partials/block-fields
                    context: blueprints://pages
