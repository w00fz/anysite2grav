title: Section module
# One horizontal section of a modular page. Hero, cards, gallery and form modules extend this;
# promote a module kind to named fields when editors need them (see references/content-model.md).
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              unset@: true
        section:
          type: tab
          title: Section
          ordering@: content
          fields:
            header.anchor:
              type: text
              label: Anchor id
              help: Becomes the section id (for #links)
            header.tone:
              type: select
              label: Tone
              help: Background and text colors from the theme palette (tokens.css)
              options: {'': Page default, light: Light, muted: Muted, dark: Dark, accent: Accent}
            header.space:
              type: select
              label: Spacing
              help: Vertical padding step from the theme scale (tokens.css → --space-*)
              options: {'': Theme default, none: None, s: Small, m: Medium, l: Large, xl: Extra large}
            header.layout:
              type: select
              label: Layout
              options: {'': Stacked, split: Split (heading beside content)}
            header.ratio:
              type: array
              label: Split ratio
              value_only: true
              help: Column widths as fr units, e.g. 1 and 2.75
            header.split_divider:
              type: toggle
              label: Rule between split columns
              highlight: 1
              default: 0
              options: {1: Yes, 0: No}
              validate: {type: bool}
            header.divider:
              type: select
              label: Divider line
              options: {'': None, top: Top, bottom: Bottom, both: Top and bottom}
            header.align:
              type: select
              label: Text alignment
              options: {'': Start, center: Center}
            header.classes:
              type: array
              label: Style hooks
              value_only: true
              help: Rendered as src-<class> CSS hooks
            header.background:
              type: media
              label: Background image
              sources: [page, site, url]
              accept: ['image/*']
            header.background_video.sources:
              type: array
              label: Background video files
              value_only: true
              help: Autoplaying muted video behind the section content
            header.background_video.poster:
              type: media
              label: Video poster
              sources: [page, site, url]
              accept: ['image/*']
            header.blocks:
              type: list
              label: Blocks
              style: vertical
              collapsed: true
              import@:
                type: partials/block-fields
                context: blueprints://pages
