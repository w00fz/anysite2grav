title: Modular page
# Grav's own modular blueprint (module collection settings) plus the exact browser title and popups.
extends@: '@parent'

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.head_title:
              type: text
              label: Browser title
              help: Exact <title>. Leave empty for "Page | Site".
              ordering@: header.title
        popups:
          type: tab
          title: Popups
          fields:
            header.sections:
              type: list
              label: Popups
              style: vertical
              collapsed: true
              help: Dialogs this page can open (buttons target them by anchor id). Visible sections are the child modules.
              fields:
                .type:
                  type: select
                  label: Type
                  default: section
                  options:
                    section: Popup
                    shared: Shared popup
                .shared:
                  type: text
                  label: Shared section name
                  help: Folder name under /shared (only for Shared popups)
                .id:
                  type: text
                  label: Anchor id
                  help: Opened by buttons with "Opens modal" set to this id
                .modal:
                  type: hidden
                  default: true
                .classes:
                  type: array
                  label: Style hooks
                  value_only: true
                .blocks:
                  type: list
                  label: Blocks
                  style: vertical
                  collapsed: true
                  import@:
                    type: partials/block-fields
                    context: blueprints://pages
